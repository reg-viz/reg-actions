name: release

on:
  push:
    tags:
      - 'v*'
    # Moving `rc-rust` release: every push to `develop` rebuilds the
    # binaries and force-updates the `rc-rust` tag + release so users can
    # try the Rust port via `uses: reg-viz/reg-actions@rc-rust` without
    # disturbing the JS-based `@rc` channel managed by deploy-rc.yml.
    branches:
      - develop
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v6-rust-rc1). Skip prefix-checks; must already exist."
        required: true

permissions:
  contents: write
  id-token: write   # for cosign keyless signing (future)
  attestations: write

# Cancel in-flight develop-driven rc-rust builds when a newer commit lands.
# Tag pushes (real releases) get unique groups so they never cancel each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/develop' }}

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      # Native cross-compile for aarch64-linux via apt's gcc cross-toolchain.
      # We previously used `cargo install cross --rev v0.2.5`, but that
      # pinned revision no longer builds on modern Rust (soundness
      # diagnostics for `&mut` to mutable statics — 18 errors in
      # cross::temp). Going through apt + a target-specific linker keeps
      # the supply-chain surface flat (no third-party cargo install).
      - name: Install aarch64 cross-toolchain (linux aarch64)
        if: ${{ matrix.cross }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
          } >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target ${{ matrix.target }} --bin reg-actions

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          ext='${{ matrix.ext }}'
          out="reg-actions-${{ matrix.target }}.tar.gz"
          tar czf "$out" -C "target/${{ matrix.target }}/release" "reg-actions${ext}"
          # Per-target .sha256 is no longer emitted here: the release job
          # regenerates a combined `checksums.txt` from the uploaded
          # tar.gz files, and Windows runners' Git Bash doesn't ship
          # `shasum`/`sha256sum` by default. Avoiding the redundant
          # hashing here keeps the matrix portable.

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-${{ matrix.target }}
          path: reg-actions-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Generate combined checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -la
          # 個別 .sha256 を統合
          rm -f checksums.txt
          for f in *.tar.gz; do
            shasum -a 256 "$f" >> checksums.txt
          done
          cat checksums.txt

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.tag || '' }}" ]; then
            name="${{ github.event.inputs.tag }}"
            moving=false
          elif [ "$GITHUB_REF" = "refs/heads/develop" ]; then
            # Moving release for the Rust port preview channel.
            name="rc-rust"
            moving=true
          else
            name="${GITHUB_REF##*/}"
            moving=false
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "moving=$moving" >> "$GITHUB_OUTPUT"

      - name: Delete previous moving release (rc-rust)
        if: steps.tag.outputs.moving == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Best-effort cleanup so softprops can recreate the tag.
          gh release delete "${{ steps.tag.outputs.name }}" --cleanup-tag --yes \
            --repo "${{ github.repository }}" || true

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign checksums (keyless OIDC)
        shell: bash
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cd dist
          cosign sign-blob \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem \
            checksums.txt

      - name: Generate SLSA-style attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'dist/*.tar.gz'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          # Pin the tag to the workflow's actual commit. Without this,
          # softprops omits target_commitish, the GitHub API falls back
          # to `repository.default_branch` (= main), and a tag created
          # from a develop push would resolve to a main commit that
          # doesn't yet contain action.yml at the root — making
          # `uses: org/repo@rc-rust` fail with
          # "Can't find 'action.yml' for action".
          target_commitish: ${{ github.sha }}
          # Don't promote the moving rc-rust release to "Latest".
          make_latest: ${{ steps.tag.outputs.moving == 'true' && 'false' || 'true' }}
          prerelease: ${{ steps.tag.outputs.moving == 'true' }}
          name: ${{ steps.tag.outputs.moving == 'true' && 'rc-rust (preview)' || steps.tag.outputs.name }}
          # Block scalar so the inline literal — which contains `uses: ` —
          # parses as a YAML string, not a nested mapping.
          body: |-
            ${{ steps.tag.outputs.moving == 'true' && 'Moving preview release built from `develop` HEAD. Use via `uses: reg-viz/reg-actions@rc-rust` to try the Rust + wasmtime port. May break or be force-updated at any time.' || '' }}
          fail_on_unmatched_files: true
          generate_release_notes: ${{ steps.tag.outputs.moving != 'true' }}
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/checksums.txt.pem
