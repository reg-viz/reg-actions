name: rust-self-test

# Build the Rust binary in this PR/branch and run reg-actions against the repo's
# own `images/` directory. This is the equivalent of the existing JS-based
# `test.yml` (`uses: ./dist`) but for the Rust pipeline — it exercises the full
# action.yml-less code path: config → event → compare (wasmtime + reg.wasm) →
# Artifact v4 upload → PR comment.
#
# Designed to run on Linux x86_64 first; expand the matrix once the linux build
# stabilises in CI.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write   # comment + minimize
  actions: read          # workflow runs / artifacts

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-self-test

      - name: Build reg-actions binary
        run: cargo build --release --bin reg-actions

      - name: Run reg-actions against images/
        env:
          INPUT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_IMAGE_DIRECTORY_PATH: ./images
          INPUT_DISABLE_BRANCH: 'true'
          INPUT_REPORT_FILE_PATH: ./report.html
          # Avoid noisy comments while we are still validating.
          INPUT_COMMENT_MODE: changes
          RUST_LOG: info,reg_actions=debug
        run: |
          set -euo pipefail
          ./target/release/reg-actions

      - name: Upload report.html
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reg-actions-self-test-report
          path: |
            report.html
            __reg__
          if-no-files-found: warn
