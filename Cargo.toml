[package]
name = "reg-actions"
version = "0.0.0"
edition = "2021"
publish = false
description = "GitHub Action for visual regression testing (Rust port of reg-actions)."
license = "MIT"
repository = "https://github.com/reg-viz/reg-actions"

[[bin]]
name = "reg-actions"
path = "src/main.rs"

[build-dependencies]
sha2 = "0.10"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
octocrab = { version = "0.43", default-features = false, features = ["rustls", "default-client"] }
wasmtime = { version = "26", default-features = false, features = ["cranelift", "parallel-compilation", "runtime", "threads"] }
wasmtime-wasi = "26"
wasmtime-wasi-threads = "26"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
glob = "0.3"
backon = "1"
regex = "1"
url = "2"
once_cell = "1"
async-trait = "0.1"
futures = "0.3"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
http-body-util = "0.1.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
